services:
  app:
    build:
      context: .
      target: runtime
    # Host port 8780 is assigned to this project; the container always
    # listens on 8000.
    ports:
      - "8780:8000"
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_KEY: ${APP_KEY:?set APP_KEY in .env, e.g. via php artisan key:generate}
      APP_URL: http://localhost:8780
      APP_TIMEZONE: UTC
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_DATABASE: ${DB_DATABASE:-sprintfwd}
      DB_USERNAME: ${DB_USERNAME:-sprintfwd}
      DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      LOG_CHANNEL: stderr
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

  mysql:
    image: mysql:8.0
    # Not published to the host: only the app container needs to reach it.
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-sprintfwd}
      MYSQL_USER: ${DB_USERNAME:-sprintfwd}
      MYSQL_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

volumes:
  mysql-data:
